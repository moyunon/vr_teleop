rm75_state_node:
  ros__parameters:
    # Known RM75-6FB controller endpoints.  This node only sends fixed get_*
    # state queries; it has no movement, enable, clear-error, or set_* command.
    left_ip: 192.168.127.18
    right_ip: 192.168.127.19
    tcp_port: 8080
    tcp_timeout_s: 0.25
    poll_period_s: 0.05
    diagnostics_period_s: 1.0
    reconnect_period_s: 1.0
    stale_timeout_s: 0.25
    publish_period_s: 0.02

    # Passive UDP support.  Keep disabled until the controllers have already
    # been configured (outside this node) to report to these two unique ports.
    # Enabling this option only binds/listens; it never changes robot settings.
    udp_enabled: false
    udp_bind_host: 0.0.0.0
    left_udp_port: 8089
    right_udp_port: 8090
