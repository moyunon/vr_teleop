# Current commissioning scope: the two bare RM75 arms only. Keep all five
# categories explicit so robot-body/environment checks can be recommissioned
# later without changing the collision interface.
category_enabled:
  left_self: true
  right_self: true
  inter_arm: true
  environment: false
  robot_body: false

# Only these links participate in readiness, transforms, and distance pairs.
# Cameras, tools/grippers, chassis, waist/head, wheels, and the external world
# are deliberately outside the current RM75-only safety claim.
monitored_links:
  left:
    - l_rm75_base_link
    - l_rm75_link_1
    - l_rm75_link_2
    - l_rm75_link_3
    - l_rm75_link_4
    - l_rm75_link_5
    - l_rm75_link_6
    - l_rm75_link_7
  right:
    - r_rm75_base_link
    - r_rm75_link_1
    - r_rm75_link_2
    - r_rm75_link_3
    - r_rm75_link_4
    - r_rm75_link_5
    - r_rm75_link_6
    - r_rm75_link_7

# Empty is valid while category_enabled.environment=false. Add only surveyed
# world-frame geometry before re-enabling that category.
environment: []

# Parent-child URDF pairs are excluded automatically. The two RM75 base links
# are also ignored because both are fixed-mounted to xb_link: their relative
# transform is independent of RM75 J1..J7 and their meshes permanently touch.
# This excludes only base-base. Every left-base/right-moving-link and
# right-base/left-moving-link pair remains monitored.
ignored_collision_pairs:
  - [l_rm75_base_link, r_rm75_base_link]

# RM75-only transforms are evaluated in the arms' common xb_link frame and
# therefore require only the fourteen l/r_rm75_joint_1..7 values.
fixed_or_externally_verified_joint_positions: {}
